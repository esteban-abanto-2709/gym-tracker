name: gym-tracker

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: gym-tracker-sql
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gym-tracker-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS API
  api:
    container_name: gym-tracker-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - PORT=4000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gym-tracker-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:4000/healthz || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  # Next.js Frontend
  web:
    container_name: gym-tracker-web
    restart: unless-stopped
    environment:
      - API_INTERNAL_URL=http://api:4000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - gym-tracker-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/api/healthz || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  # Cloudflare Tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: gym-tracker-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - web
    networks:
      - gym-tracker-network

volumes:
  postgres_data:

networks:
  gym-tracker-network:
    driver: bridge
