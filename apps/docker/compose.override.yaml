services:
  postgres:
    ports:
      - "5432:5432"

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    ports:
      - "4000:4000"

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    ports:
      - "3000:3000"

  cloudflared:
    profiles: [tunnel]
